services:
  vibevoice-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibevoice-api:latest
    container_name: vibevoice-api
    init: true

    # Reserve one GPU. Change 0 when this service should use a different card.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

    # API_PORT controls the host port only. The container always listens on 8001,
    # preventing a custom host port from breaking the internal mapping.
    ports:
      - "${API_PORT:-8001}:8001"

    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - API_WORKERS=1
      - VOICES_DIR=/app/voices

    volumes:
      - ${VOICES_DIR:-./demo/voices}:/app/voices:ro
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface:rw
      - ${MODELS_DIR:-./models}:/app/models:rw
      - ${TORCH_CACHE_DIR:-./.cache/torch_compile_vibevoice}:/app/torch_cache:rw

    restart: unless-stopped
    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Model download and compilation can legitimately take several minutes.
      start_period: 300s

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
